name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit / contract tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # PR builds do not need real secrets; placeholder verifies compile/bundle.
          VITE_SHEET_URL: https://example.invalid/macros/s/ci-placeholder/exec
          VITE_GEMINI_API_KEY: ''
          VITE_DRIVE_FOLDER_REMITOS: ''
          VITE_DRIVE_FOLDER_FACTURAS: ''
          VITE_DRIVE_FOLDER_DOCUMENTOS: ''
